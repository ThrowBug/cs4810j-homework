name: Create Book
setup_function: login_to_bookstack
steps:
- action: From the dashboard click 'Books' link in navigation
  expectation: Books listing page appears
  action_check: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()
  url: /books
  solution: |
    page.get_by_role("link", name="Books", exact=True).click()

- action: Click 'Create New Book' link
  expectation: Book creation form opens with 'Save Book' button
  action_check: |
    expect(page.get_by_role("heading", name="Create New Book")).to_be_visible()
  url: /create-book
  solution: |
    page.get_by_role("link", name="Create New Book").click()

- action: Type 'New Book' in the Name field
  expectation: Name field contains typed text
  action_check: |
    expect(page.get_by_role("textbox", name="Name")).to_have_value("New Book")
  url: /create-book
  solution: |
    page.get_by_role("textbox", name="Name").fill("New Book")

- action: Type 'New Book Description' in the Description textarea
  expectation: Description textarea contains typed text
  action_check: |
    expect(page.locator("iframe[title=\"Rich Text Area\"]").content_frame.get_by_role("paragraph")).to_contain_text("New Book Description")
  url: /create-book
  solution: |
    page.locator("iframe[title=\"Rich Text Area\"]").content_frame.get_by_label("Rich Text Area. Press ALT-0").fill("New Book Description")

- action: Scroll the page down
  expectation: '''Cancel'' and ''Save Book'' buttons are visible'
  action_check: |
    expect(page.get_by_role("button", name="Save Book")).to_be_visible()
  url: /create-book
  solution: |
    page.evaluate("window.scrollTo(0, document.body.scrollHeight)")

- action: Click 'Save Book' button
  expectation: Page title contains 'New Book'
  action_check: |
    expect(page.get_by_role("heading", name="New Book")).to_be_visible()
  url: /books/new-book
  solution: |
    page.get_by_role("button", name="Save Book").click()

- action: Click 'Books' link in navigation
  expectation: Books list (title, description) before and after is consistent with user activities
  action_check: |
    expect(page.locator("#recents").get_by_role("link", name="New Book")).to_be_visible()
  url: /books
  solution: |
    page.locator("#header").get_by_role("link", name="Books", exact=True).click()

assertion_check: |
  # The books list is the seeded books plus 'New Book' with the description that was entered.
  expect(page.locator("main .grid-card h2")).to_have_text(["Book", "Book1", "Book2", "New Book"])
  new_book = page.locator("main a.grid-card").filter(has=page.get_by_role("heading", name="New Book", exact=True))
  expect(new_book.locator("p.text-muted").first).to_have_text("New Book Description")
